<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyNest · 파이썬 교육 플랫폼</title>
  <script>
    // 처음 방문한 로그아웃 사용자는 소개 페이지로. ?app, 해시 경로, 설치 앱, 로그인 기록이 있으면 바로 앱으로.
    (function () {
      try {
        var q = location.search, h = location.hash;
        if (/(^|[?&])app(=|&|$)/.test(q)) { localStorage.setItem('pn_app', '1'); return; }
        if (localStorage.getItem('pn_app')) return;
        if (h && h !== '#' && h !== '#/') return;
        if (window.Capacitor || matchMedia('(display-mode: standalone)').matches) return;
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (/^sb-.*-auth-token$/.test(k)) return;
        }
        location.replace('landing/' + q);
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="강의, 학습 코스, 자동 채점 문제, 시험, 랭킹까지. 파이썬 수업에 필요한 것을 한곳에 모은 교육 플랫폼 PyNest.">
  <link rel="canonical" href="https://pynest.kro.kr/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PyNest">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:title" content="PyNest · 파이썬 교육 플랫폼">
  <meta property="og:description" content="강의부터 시험까지, 파이썬 교육의 전 과정을 한곳에서.">
  <meta property="og:url" content="https://pynest.kro.kr/">
  <meta property="og:image" content="https://pynest.kro.kr/landing/assets/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://pynest.kro.kr/landing/assets/og.jpg">
  <script>
    // 깜빡임 방지: 저장된 테마(또는 기기 설정)를 먼저 적용
    try {
      var t = localStorage.getItem('theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <meta name="theme-color" content="#3b6cf6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PyNest">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app"><p class="loading">불러오는 중…</p></div>
  <div id="toasts"></div>
  <footer id="verfoot"></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="ide.js"></script>
  <script src="patchnotes.js"></script>
  <script src="app.js"></script>
  <script>if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function () {});</script>
</body>
</html>
